<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AERO - Optimized Module</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. 基础配置
           ========================================= */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-panel: rgba(255, 255, 255, 0.96);
            --border-color: rgba(226, 232, 240, 0.8);
            --shadow-soft: 0 12px 32px -8px rgba(0, 0, 0, 0.08);
            
            --text-main: #334155;
            --text-muted: #94a3b8;
            
            /* 状态色 */
            --color-err: #ef4444;
            --color-warn: #f59e0b;
            --color-success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            background-image: radial-gradient(circle at 10% 20%, rgb(239, 246, 255) 0%, rgb(255, 255, 255) 90%);
            height: 100vh; display: flex; align-items: center; justify-content: center; 
        }

        /* 模块容器 */
        .aero-console-module {
            display: flex; flex-direction: column; gap: 16px;
            width: 100%; height: 100%; color: var(--text-main);
        }

        .glass-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
            display: flex; flex-direction: column; overflow: hidden;
            transition: box-shadow 0.3s;
        }
        .glass-panel:hover { box-shadow: 0 16px 40px -10px rgba(0,0,0,0.1); }

        /* =========================================
           2. 滚动条深度美化 (Scrollbar)
           ========================================= */
        /* 针对 Webkit 内核 (Chrome, Edge, Safari) */
        ::-webkit-scrollbar {
            width: 6px; /* 极细 */
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
            margin: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; /* 浅灰条 */
            border-radius: 10px; /* 圆角 */
            border: 2px solid transparent; /* 增加透明边框让条看起来更细 */
            background-clip: content-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; /* 悬停加深 */
            border: 1px solid transparent;
            background-clip: content-box;
        }

        /* =========================================
           3. Timeline 区域
           ========================================= */
        .event-container { height: 160px; flex-shrink: 0; }
        
        .panel-header {
            padding: 12px 16px; background: rgba(255,255,255,0.6);
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .panel-title { 
            font-size: 11px; font-weight: 700; color: var(--text-muted); 
            text-transform: uppercase; letter-spacing: 0.5px; 
            display: flex; align-items: center; gap: 8px; 
        }
        .badge-count { 
            background: #e2e8f0; color: #64748b; font-size: 10px; 
            padding: 2px 8px; border-radius: 12px; font-weight: 700; 
        }

        .event-list {
            flex: 1; overflow-y: auto; overflow-x: hidden; 
            padding: 12px; display: flex; flex-direction: column; gap: 8px;
        }

        .event-card {
            background: #ffffff; border-radius: 8px; padding: 10px 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); border: 1px solid #f1f5f9;
            display: flex; flex-direction: column; gap: 4px;
            border-left: 3px solid transparent; width: 100%;
            animation: slideInRight 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .event-top { display: flex; align-items: center; justify-content: space-between; }
        .event-type { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
        .event-time { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono'; opacity: 0.8; }
        .event-msg { font-size: 11px; color: #475569; line-height: 1.4; padding-left: 2px; }

        .type-error { border-left-color: var(--color-err); } .type-error .event-type { color: var(--color-err); }
        .type-warn { border-left-color: var(--color-warn); } .type-warn .event-type { color: var(--color-warn); }
        .type-success { border-left-color: var(--color-success); } .type-success .event-type { color: var(--color-success); }
        
        .empty-state { text-align: center; color: #cbd5e1; font-size: 11px; padding-top: 30px; }

        /* =========================================
           4. Console 区域
           ========================================= */
        .terminal-container { flex: 1; min-height: 0; }

        .term-toolbar { display: flex; gap: 6px; align-items: center; }
        .term-btn {
            background: transparent; border: 1px solid #e2e8f0; color: #64748b;
            padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; white-space: nowrap;
        }
        .term-btn:hover { background: #f8fafc; color: var(--primary); border-color: var(--primary); transform: translateY(-1px); }
        .term-btn.active { background: #eff6ff; color: var(--primary); border-color: var(--primary); }
        
        /* 模拟按钮呼吸动画 */
        .term-btn.sim-btn.active { 
            background: #ecfdf5; color: #059669; border-color: #059669;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.2); }
            70% { box-shadow: 0 0 0 4px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .term-body {
            flex: 1; background: #ffffff; padding: 12px; overflow-y: auto;
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            /* 内阴影增加深度 */
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02); 
        }

        /* --- Drawer (抽屉) 优化 --- */
        .drawer-header {
            padding: 10px 16px; background: #ffffff; 
            border-top: 1px solid #f1f5f9; border-bottom: 1px solid transparent;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; user-select: none; transition: all 0.2s;
        }
        .drawer-header:hover { background: #f8fafc; }
        .drawer-header.active { background: #f8fafc; border-bottom-color: #f1f5f9; }
        .drawer-title { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; }
        .drawer-icon { color: #cbd5e1; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .drawer-header.active .drawer-icon { transform: rotate(180deg); color: var(--primary); }

        .drawer-content {
            background: #f8fafc; max-height: 0; overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .drawer-content.open { max-height: 200px; overflow-y: auto; }
        .drawer-grid { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; }

        .preset-chip {
            background: white; color: #475569; border: 1px solid #e2e8f0;
            padding: 5px 12px; border-radius: 8px; font-size: 10px; font-weight: 600;
            cursor: pointer; transition: 0.2s; flex-grow: 1; text-align: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .preset-chip:hover { 
            border-color: #cbd5e1; transform: translateY(-1px); 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); color: var(--primary);
        }
        .preset-chip:active { transform: translateY(0); }
        .preset-chip.danger { color: #dc2626; border-color: #fecaca; background: #fff5f5; }
        .preset-chip.danger:hover { background: #fee2e2; border-color: #fca5a5; }

        /* =========================================
           5. 底部交互区域 (Input) 优化
           ========================================= */
        .input-bar { 
            padding: 12px 16px 16px 16px; 
            background: white; 
            display: flex; gap: 10px; align-items: center;
            border-top: 1px solid #f1f5f9; 
            position: relative; z-index: 2;
        }
        
        .cmd-input {
            flex: 1; 
            background: #f8fafc; 
            border: 1px solid transparent; /* 默认无边框 */
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.04); /* 微凹效果 */
            border-radius: 10px; 
            padding: 0 14px; 
            height: 38px; 
            font-family: 'JetBrains Mono'; font-size: 12px; color: var(--text-main);
            outline: none; transition: 0.2s;
        }
        .cmd-input:focus { 
            background: white; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1); /* 聚焦光晕 */
        }
        .cmd-input::placeholder { color: #cbd5e1; }

        .send-btn {
            width: 38px; height: 38px; 
            background: var(--primary); color: white; border: none;
            border-radius: 10px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(37,99,235,0.3);
            transition: all 0.2s;
        }
        .send-btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 10px -2px rgba(37,99,235,0.4); }
        .send-btn:active { transform: translateY(0); }
        .send-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; }

        /* Log Styles */
        .log-entry { display: flex; gap: 10px; padding: 3px 6px; border-radius: 4px; border-bottom: 1px solid transparent; }
        .log-entry:nth-child(even) { background: rgba(248, 250, 252, 0.5); } /* 隔行微变色 */
        .log-entry:hover { background: #f1f5f9; }
        .log-ts { color: #cbd5e1; font-size: 10px; min-width: 55px; user-select: none; }
        .log-dir { font-weight: 800; font-size: 9px; width: 22px; text-align: center; border-radius: 4px; padding: 1px 0; }
        .log-dir.rx { color: #059669; background: #ecfdf5; border: 1px solid #d1fae5; }
        .log-dir.tx { color: #2563eb; background: #eff6ff; border: 1px solid #dbeafe; }
        .log-txt { color: #334155; flex: 1; word-break: break-all; }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- 演示容器 (你在项目里直接把里面的 div 拿走就行) -->
    <div style="width: 380px; height: 90vh;">
        
        <!-- >>> 模块开始 <<< -->
        <div class="aero-console-module">
            
            <!-- 1. Timeline -->
            <div class="glass-panel event-container">
                <div class="panel-header">
                    <div class="panel-title">
                        <!-- 优化后的时钟图标 -->
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        Timeline
                    </div>
                    <span class="badge-count" id="event-count">0</span>
                </div>
                <div class="event-list" id="event-list">
                    <div class="empty-state">No system events recorded.</div>
                </div>
            </div>

            <!-- 2. Console -->
            <div class="glass-panel terminal-container">
                <div class="panel-header">
                    <div class="panel-title">
                        <!-- 优化后的终端图标 -->
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                        Console
                    </div>
                    <div class="term-toolbar">
                        <button class="term-btn sim-btn" id="btn-sim" onclick="AeroConsole.toggleSim()">⚡ Sim</button>
                        <button class="term-btn active" id="btn-ts" onclick="AeroConsole.toggleTs()">Time</button>
                        <button class="term-btn active" id="btn-pause" onclick="AeroConsole.togglePause()">Run</button>
                        <button class="term-btn active" id="btn-scroll" onclick="AeroConsole.toggleAutoScroll()">Auto</button>
                        <button class="term-btn" onclick="AeroConsole.clearTerm()">Clr</button>
                    </div>
                </div>
                
                <div class="term-body" id="term-body">
                    <div class="log-entry"><span class="log-ts">--:--:--</span><span class="log-txt" style="color:#94a3b8">Terminal ready...</span></div>
                </div>

                <!-- 抽屉 -->
                <div class="drawer-header" onclick="AeroConsole.toggleDrawer(this)">
                    <span class="drawer-title">Quick Actions</span>
                    <!-- 优化后的 Chevron 图标 -->
                    <svg class="drawer-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                </div>
                <div class="drawer-content" id="drawer-content">
                    <div class="drawer-grid">
                        <div class="preset-chip" onclick="AeroConsole.quickSend('status')">STATUS</div>
                        <div class="preset-chip" onclick="AeroConsole.quickSend('version')">VER</div>
                        <div class="preset-chip" onclick="AeroConsole.quickSend('dump')">DUMP</div>
                        <div class="preset-chip" onclick="AeroConsole.quickSend('tasks')">TASKS</div>
                        <div class="preset-chip" onclick="AeroConsole.quickSend('gps')">GPS</div>
                        <div class="preset-chip" onclick="AeroConsole.quickSend('imu')">IMU</div>
                        <div class="preset-chip danger" onclick="AeroConsole.quickSend('reboot')">REBOOT</div>
                        <div class="preset-chip danger" onclick="AeroConsole.quickSend('reset')">RESET</div>
                    </div>
                </div>

                <!-- 底部输入区 -->
                <div class="input-bar">
                    <input type="text" class="cmd-input" id="cmd-input" placeholder="Enter command..." onkeypress="AeroConsole.handleEnter(event)">
                    <button class="send-btn" onclick="AeroConsole.sendCommand()">
                        <!-- 纸飞机图标 -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
            
        </div>
        <!-- >>> 模块结束 <<< -->

    </div>

    <script>
        const AeroConsole = (function() {
            // DOM References
            const eventList = document.getElementById('event-list');
            const eventCountBadge = document.getElementById('event-count');
            const termBody = document.getElementById('term-body');
            const cmdInput = document.getElementById('cmd-input');
            const drawerContent = document.getElementById('drawer-content');

            // State
            let eventCount = 0;
            let autoScroll = true;
            let showTs = true;
            let isPaused = false;
            let simInterval;
            let isSim = false;

            // --- Methods ---

            function toggleDrawer(header) {
                drawerContent.classList.toggle('open');
                header.classList.toggle('active');
            }

            function addEvent(type, title, msg) {
                const emptyState = eventList.querySelector('.empty-state');
                if(emptyState) emptyState.remove();

                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-GB', { hour12: false });
                
                // Optimized Icons (Lucide style)
                const icons = {
                    'error': `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
                    'warn': `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
                    'success': `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`
                };

                const div = document.createElement('div');
                div.className = `event-card type-${type}`;
                div.innerHTML = `
                    <div class="event-top"><div class="event-type">${icons[type] || ''} <span>${title}</span></div><span class="event-time">${timeStr}</span></div>
                    <div class="event-msg">${msg}</div>
                `;
                eventList.prepend(div);
                eventCount++;
                eventCountBadge.innerText = eventCount;
            }

            function logTerm(msg, dir='RX') {
                if(isPaused) return;

                const now = new Date();
                const ts = now.toLocaleTimeString('en-GB', { hour12: false });
                const div = document.createElement('div');
                div.className = 'log-entry';
                
                let html = '';
                if(showTs) html += `<span class="log-ts">${ts}</span>`;
                html += `<span class="log-dir ${dir.toLowerCase()}">${dir}</span><span class="log-txt">${msg}</span>`;
                
                div.innerHTML = html;
                termBody.appendChild(div);

                if(termBody.children.length > 200) termBody.removeChild(termBody.firstChild);
                if(autoScroll) termBody.scrollTop = termBody.scrollHeight;
            }

            function sendCommand() {
                const val = cmdInput.value.trim();
                if(!val) return;
                logTerm(val, 'TX');
                cmdInput.value = '';
                setTimeout(() => { logTerm('ACK', 'RX') }, 50);
            }

            function quickSend(cmd) {
                cmdInput.value = cmd;
                sendCommand();
            }

            function toggleAutoScroll() {
                autoScroll = !autoScroll;
                document.getElementById('btn-scroll').classList.toggle('active');
            }
            function toggleTs() {
                showTs = !showTs;
                document.getElementById('btn-ts').classList.toggle('active');
            }
            function togglePause() {
                isPaused = !isPaused;
                const btn = document.getElementById('btn-pause');
                btn.innerText = isPaused ? "Paused" : "Run";
                btn.classList.toggle('active');
            }
            function clearTerm() { termBody.innerHTML = ''; }
            function handleEnter(e) { if(e.key === 'Enter') sendCommand(); }

            // Demo Simulation
            function toggleSim() {
                isSim = !isSim;
                document.getElementById('btn-sim').classList.toggle('active');
                if(isSim) {
                    addEvent('success', 'Connected', 'SITL link active.');
                    simInterval = setInterval(() => {
                        const r = Math.random();
                        if(r > 0.98) addEvent('warn', 'Delay', 'High latency detected.');
                        else logTerm(`DATA: ${Math.floor(Math.random()*255)}`);
                    }, 250);
                } else {
                    clearInterval(simInterval);
                    addEvent('warn', 'Stopped', 'Link closed.');
                }
            }

            return {
                toggleDrawer, addEvent, logTerm, sendCommand, quickSend,
                toggleAutoScroll, toggleTs, togglePause, clearTerm, 
                handleEnter, toggleSim
            };

        })();
    </script>
</body>
</html>
