<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIO SYSTEM: GCS // BLADE PROTOCOL</title>
  <link rel="stylesheet" href="styles/load.css">

</head>
<body>

  <div class="cockpit-container">
    <div class="cockpit-layer" id="layer-bg" data-depth="0.02">
      <div class="hex-grid"></div>
      
      <!-- ★★★ 替换原来的 canvas ★★★ -->
      <a-waves>
        <svg class="js-svg"></svg>
      </a-waves>
      <!-- ★★★★★★★★★★★★★★★★★★★★★ -->
      
    </div>
    
    <!-- 战术圆环层：结构微调 -->
    <div class="cockpit-layer" id="layer-rings" data-depth="0.08">
      <!-- 外层：扫描环 (基准) -->
      <div class="magic-ring ring-outer"></div>
      
      <!-- 中层：伺服机械环 (带游标装饰) -->
      <div class="magic-ring ring-middle">
        <div class="ring-decoration"></div>
      </div>
      
      <!-- 内层：姿态仪 (虚线刻度) -->
      <div class="magic-ring ring-inner"></div>
    </div>

    <!-- 核心层 -->
    <div class="cockpit-layer" id="layer-core" data-depth="0.15">
      <div class="zero-trigger-zone" id="trigger-zone">
        
        <!-- 1. 新增：全息护盾 (Hex-Shield) -->
        <div class="hex-shield"></div>

        <!-- 2. 新增：AI 神经网络 (Synapse) -->
        <div class="ai-synapse">
          <div class="node-dot nd-1"></div>
          <div class="node-dot nd-2"></div>
          <div class="node-dot nd-3"></div>
          <div class="node-dot nd-4"></div>
          <div class="synapse-line sl-1"></div>
          <div class="synapse-line sl-2"></div>
        </div>

        <!-- 3. 新增：两侧算法数据流 -->
        <div class="algo-stream">
          <div class="stream-col" id="algo-left">0110<br>1011<br>AF09</div>
          <div class="stream-col" id="algo-right">32X<br>NULL<br>PTR</div>
        </div>

        <!-- 原有的粒子容器 -->
        <div class="energy-particle-ring">
          <div class="particle p1"></div>
          <div class="particle p2"></div>
          <div class="particle p3"></div>
          <div class="particle p4"></div>
        </div>

        <div class="titan-wrapper" id="titan-core">
          <svg class="geass-sigil" viewBox="0 0 100 100">
            <path d="M50 20 Q70 5 90 20 T70 50 Q50 70 30 50 T10 20 Q30 5 50 20 Z" fill="none" /> 
            <path d="M50 35 L65 15 L75 25 L60 40 L85 30 L90 40 L60 55 L50 85 L40 55 L10 40 L15 30 L40 40 L25 25 L35 15 Z" />
          </svg>
          <div class="armor armor-tl"></div>
          <div class="armor armor-tr"></div>
          <div class="armor armor-bl"></div>
          <div class="armor armor-br"></div>
        </div>
        <div class="shockwave" id="shockwave"></div>
      </div>

      <!-- ★★★ 在这里把"澪"加回来 ★★★ -->
      <div class="bottom-cmd">
        <div class="cmd-title" data-text="接入序列">接入序列</div>
        <div class="cmd-sub" id="status-text">SYSTEM STANDBY</div>
      </div>
    </div>

    <!-- HUD 层 -->
    <div class="cockpit-layer" id="layer-hud" data-depth="0.0">
      <div class="hud-frame">
        <div class="bracket bk-tl"></div><div class="bracket bk-tr"></div>
        <div class="bracket bk-bl"></div><div class="bracket bk-br"></div>

        <!-- 保留四角极小的文字（可选，如果不想要也可以删掉） -->
        <div class="corner-status cs-tl">SYS: ARMED</div>
        <div class="corner-status cs-tr"><span class="rec-dot"></span>REC</div>
        <div class="corner-status cs-bl">GPS: 3D FIX</div>
        <div class="corner-status cs-br">TX: HIGH</div>
      </div>
    </div>
  </div>

  <div class="transition-veil" id="transition-veil">
    <div class="veil-noise"></div>
    <div class="veil-text">
      <span class="veil-label">MIO HANDSHAKE</span>
      <span class="veil-status" id="veil-status">Aligning channels...</span>
    </div>
  </div>

  <script src="js/load.js"></script>

</body>
</html>
